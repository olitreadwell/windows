# Windows Codex config. The default-skills block is generated by
# scripts/Sync-DefaultSkills.ps1 from the two standing skill files.
model = "deepseek-v4.1-flash:cloud"
model_provider = "ollama-cloud"
model_context_window = 400000
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "xhigh"
model_catalog_json = "~/.codex/model-catalog.json"
approval_policy = "never"
sandbox_mode = "danger-full-access"

# The ollama-cloud provider rejects the web_search tool instead of ignoring it.
web_search = "disabled"

# network_access = "enabled"
