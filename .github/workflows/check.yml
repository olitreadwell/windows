name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test on Windows PowerShell 5.1
        shell: powershell
        run: .\tests\run.ps1

      - name: Dry run on Windows PowerShell 5.1
        shell: powershell
        run: .\bootstrap.ps1 -DryRun

      - name: Test on PowerShell 7
        shell: pwsh
        run: .\tests\run.ps1

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }
